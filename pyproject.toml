[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairaudit-randhie"
version = "0.1.0"
description = "Reproducible, contextual group disparity audit of RAND HIE outpatient utilization"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<1.9", "statsmodels>=0.14,<0.16",
  "fairlearn>=0.12,<0.15", "PyYAML>=6,<7", "matplotlib>=3.7,<4",
  "Jinja2>=3.1,<4", "joblib>=1.3,<2"
]
[project.optional-dependencies]
app = ["streamlit>=1.38,<2", "plotly>=5,<7"]
aif360 = ["aif360>=0.6.1,<0.7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
