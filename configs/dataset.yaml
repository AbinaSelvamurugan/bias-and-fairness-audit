version: 1
identifier: statsmodels:randhie
version_policy: "statsmodels >=0.14,<0.16; record the installed version"
source: https://www.statsmodels.org/stable/datasets/generated/randhie.html
license: public-domain (per statsmodels dataset documentation)
raw_rows_expected: 20190
target_source: mdvis
